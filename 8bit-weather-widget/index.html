<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Weather Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget-container">
        <div id="weather-icon" class="weather-icon"></div>
        <div class="weather-info">
            <h1 id="city">Загрузка...</h1>
            <p id="temp">--°C</p>
            <p id="desc">Ожидание данных</p>
        </div>
        <div class="controls">
            <input type="text" id="city-input" placeholder="Введите город..." class="pixel-input">
            <button id="search-btn" class="pixel-button">OK</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
