[pytest]
# test_v3.py is a manual end-to-end script (requires playwright, network and a
# live LLM); it is not a unit test and is excluded from the default run.
addopts = --ignore=test_v3.py
norecursedirs = .venv node_modules client client-web server server-web ida-app mobile-app drizzle drizzle-web dist build
