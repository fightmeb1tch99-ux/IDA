<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <rect width="600" height="200" fill="#000"/>
  <style>
    .glitch {
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 72px;
      fill: #fff;
      animation: glitch 2.5s infinite;
    }
    .glitch2 {
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 72px;
      fill: #0f0;
      opacity: 0.7;
      animation: glitch2 2.5s infinite;
    }
    .glitch3 {
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 72px;
      fill: #f0f;
      opacity: 0.5;
      animation: glitch3 2.5s infinite;
    }
    .sub {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      fill: #0f0;
      letter-spacing: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-3px, 1px); }
      94% { transform: translate(3px, -1px); }
      96% { transform: translate(-2px, 2px); }
      98% { transform: translate(2px, -2px); }
    }
    @keyframes glitch2 {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      92% { transform: translate(4px, -2px); opacity: 0.7; }
      94% { transform: translate(-4px, 2px); opacity: 0.7; }
      96% { opacity: 0; }
    }
    @keyframes glitch3 {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      93% { transform: translate(-5px, 1px); opacity: 0.5; }
      95% { transform: translate(5px, -1px); opacity: 0.5; }
      97% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
  <text x="300" y="100" text-anchor="middle" class="glitch3">DEDSEC</text>
  <text x="300" y="100" text-anchor="middle" class="glitch2">DEDSEC</text>
  <text x="300" y="100" text-anchor="middle" class="glitch">DEDSEC</text>
  <text x="300" y="145" text-anchor="middle" class="sub">CODE AUDIT SYSTEM</text>
  <text x="300" y="170" text-anchor="middle" class="sub" style="font-size:11px;letter-spacing:4px;">[ SCAN • FIX • SECURE ]</text>
</svg>
