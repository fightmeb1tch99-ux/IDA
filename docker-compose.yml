version: '3.8'

services:
  ida-backend:
    build: .
    container_name: ida-backend
    ports:
      - "8000:8000"
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LOG_LEVEL=INFO
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ida-frontend:
    image: node:22-alpine
    container_name: ida-frontend
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./ida-app:/app
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    depends_on:
      - ida-backend

volumes:
  memory:
  logs:

networks:
  default:
    name: ida-network
